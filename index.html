<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кофейная рулетка</title>
<meta name="description" content="Не знаешь, что заказать? Доверься случаю.">
<meta name="theme-color" content="#140c08">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2324150F'/%3E%3Cpath d='M16 24h26v14a10 10 0 0 1-10 10h-6a10 10 0 0 1-10-10V24z' fill='%23D96B27'/%3E%3Cpath d='M42 27h4a6 6 0 0 1 0 12h-4' fill='none' stroke='%23D96B27' stroke-width='4'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #140c08;
    --surface: #24150f;
    --surface-2: #2e1c14;
    --line: #3a2418;
    --text: #f6ede5;
    --muted: #a58b7a;
    --accent: #d96b27;
    --accent-soft: #f0a05e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(900px 480px at 85% -10%, rgba(217, 107, 39, .12), transparent 60%),
      radial-gradient(700px 400px at 10% 110%, rgba(240, 160, 94, .07), transparent 60%),
      var(--bg);
    -webkit-tap-highlight-color: transparent;
  }
  main { width: min(560px, 100%); text-align: center; }
  header { margin-bottom: 20px; }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 7vw, 40px);
    letter-spacing: -.5px;
    line-height: 1.1;
  }
  .sub { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.4; }
  .cupwrap { position: relative; display: flex; justify-content: center; margin: 6px 0 14px; }
  .cup {
    width: clamp(150px, 40vw, 200px);
    height: auto;
    filter: drop-shadow(0 18px 30px rgba(217, 107, 39, .22));
    transition: transform .18s ease;
  }
  .shaking .cup { animation: shake .5s ease; }
  @keyframes shake {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(-7deg) translateY(-4px); }
    40% { transform: rotate(6deg) translateY(2px); }
    60% { transform: rotate(-5deg) translateY(-2px); }
    80% { transform: rotate(4deg); }
  }
  .steam {
    stroke: var(--accent-soft);
    stroke-width: 4;
    stroke-linecap: round;
    fill: none;
    opacity: .55;
    animation: steam 2.6s ease-in-out infinite;
  }
  .steam.s2 { animation-delay: .5s; }
  .steam.s3 { animation-delay: 1s; }
  @keyframes steam {
    0%, 100% { opacity: .15; transform: translateY(0); }
    50% { opacity: .6; transform: translateY(-4px); }
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .chip {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 8px 14px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: transparent;
    color: #1d0f07;
    font-weight: 600;
  }
  .spin {
    appearance: none;
    border: 0;
    border-radius: 16px;
    padding: 16px 28px;
    width: min(320px, 100%);
    background: linear-gradient(135deg, var(--accent-soft), var(--accent));
    color: #1d0f07;
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .2px;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(217, 107, 39, .25);
    transition: transform .12s ease, opacity .2s ease;
  }
  .spin:active { transform: scale(.97); }
  .spin[disabled] { opacity: .6; cursor: default; }
  .card {
    margin-top: 18px;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    padding: 22px 20px 20px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .25s ease, transform .25s ease;
  }
  .card.show { opacity: 1; transform: none; }
  .card[hidden] { display: none; }
  .name { margin: 0 0 6px; font-size: 26px; letter-spacing: -.3px; }
  .desc { margin: 0 auto 16px; color: var(--muted); font-size: 14.5px; line-height: 1.5; max-width: 42ch; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 18px; }
  .tag {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12.5px;
    color: var(--text);
    background: rgba(255, 255, 255, .03);
  }
  .strength { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 4px; }
  .bean { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .bean.on { background: var(--accent); }
  .again {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    border-radius: 14px;
    padding: 12px 20px;
    font: inherit;
    font-size: 14.5px;
    cursor: pointer;
  }
  footer { margin-top: 22px; color: var(--muted); font-size: 12px; line-height: 1.5; }
  footer a { color: var(--accent-soft); }
  @media (prefers-reduced-motion: reduce) {
    .steam, .shaking .cup { animation: none; }
    .card { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Кофейная рулетка</h1>
    <p class="sub">Не знаешь, что заказать? Доверься случаю.</p>
  </header>

  <div class="cupwrap" id="cupwrap" aria-hidden="true">
    <svg class="cup" viewBox="0 0 200 180" role="img">
      <path class="steam s1" d="M74 40c-6-8 6-14 0-24"/>
      <path class="steam s2" d="M100 34c-6-8 6-14 0-24"/>
      <path class="steam s3" d="M126 40c-6-8 6-14 0-24"/>
      <path d="M46 70h88v30a34 34 0 0 1-34 34H80a34 34 0 0 1-34-34V70z" fill="#d96b27"/>
      <path d="M134 78h10a16 16 0 0 1 0 32h-10" fill="none" stroke="#d96b27" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="90" cy="70" rx="44" ry="9" fill="#f0a05e"/>
      <path d="M62 92c10 8 46 8 56 0" stroke="#a34c16" stroke-width="4" fill="none" stroke-linecap="round" opacity=".55"/>
    </svg>
  </div>

  <div class="chips" role="group" aria-label="Настроение">
    <button class="chip" type="button" data-filter="any" aria-pressed="true">Любое</button>
    <button class="chip" type="button" data-filter="wake" aria-pressed="false">Взбодриться</button>
    <button class="chip" type="button" data-filter="treat" aria-pressed="false">Побаловать себя</button>
    <button class="chip" type="button" data-filter="cold" aria-pressed="false">Холодное</button>
  </div>

  <button class="spin" id="spin" type="button">Крутить</button>

  <section class="card" id="card" hidden aria-live="polite">
    <h2 class="name" id="name"></h2>
    <p class="desc" id="desc"></p>
    <div class="stats" id="stats"></div>
    <button class="again" id="again" type="button">Ещё раз</button>
  </section>

  <footer>Сделано за 20 минут по приколу. Пьём ответственно.</footer>
</main>

<script>
const DRINKS = [
  { name: "Эспрессо", ml: 30, strength: 5, tags: ["wake"], cold: false, desc: "Маленький, но гордый. Пьётся за 20 секунд, бодрит на два часа." },
  { name: "Доппио", ml: 60, strength: 5, tags: ["wake"], cold: false, desc: "Двойной удар. Для случаев, когда один эспрессо — это разминка." },
  { name: "Американо", ml: 200, strength: 3, tags: ["wake"], cold: false, desc: "Эспрессо, который решил стать длинным. Честный и без лишнего." },
  { name: "Капучино", ml: 200, strength: 3, tags: ["treat"], cold: false, desc: "Классика жанра: молочная пенка и кофе в идеальном балансе." },
  { name: "Латте", ml: 300, strength: 2, tags: ["treat"], cold: false, desc: "Молока больше, нежности тоже. Можно пить через трубочку и не спешить." },
  { name: "Флэт уайт", ml: 180, strength: 4, tags: ["wake"], cold: false, desc: "Двойной эспрессо и тонкое молоко. Для тех, кто знает, чего хочет." },
  { name: "Раф", ml: 250, strength: 3, tags: ["treat"], cold: false, desc: "Сливки, ваниль и кофе. Десерт, который разрешили пить утром." },
  { name: "Мокко", ml: 300, strength: 3, tags: ["treat"], cold: false, desc: "Кофе встретил шоколад. Дальше вы знаете." },
  { name: "Колд брю", ml: 250, strength: 4, tags: ["wake"], cold: true, desc: "Холодный, дерзкий, настаивается 12 часов. Летом — идеально." },
  { name: "Фильтр", ml: 250, strength: 3, tags: [], cold: false, desc: "Светлая обжарка, ягодные ноты. Для неспешного утра." },
  { name: "Кортадо", ml: 120, strength: 4, tags: ["wake"], cold: false, desc: "Эспрессо с каплей молока. Минимум, но по делу." },
  { name: "Макиато", ml: 60, strength: 4, tags: [], cold: false, desc: "Эспрессо с пятном молочной пены. На один глоток роскоши." },
];

const cupwrap = document.getElementById("cupwrap");
const spinBtn = document.getElementById("spin");
const card = document.getElementById("card");
const nameEl = document.getElementById("name");
const descEl = document.getElementById("desc");
const statsEl = document.getElementById("stats");
const againBtn = document.getElementById("again");
const chips = [...document.querySelectorAll(".chip")];
let filter = "any";
let busy = false;

chips.forEach((chip) => {
  chip.addEventListener("click", () => {
    filter = chip.dataset.filter;
    chips.forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
  });
});

function pool() {
  if (filter === "any") return DRINKS;
  if (filter === "cold") return DRINKS.filter((d) => d.cold);
  return DRINKS.filter((d) => d.tags.includes(filter));
}

function beans(n) {
  const wrap = document.createElement("span");
  wrap.className = "strength";
  for (let i = 1; i <= 5; i += 1) {
    const b = document.createElement("span");
    b.className = "bean" + (i <= n ? " on" : "");
    wrap.appendChild(b);
  }
  return wrap;
}

function show(drink) {
  nameEl.textContent = drink.name;
  descEl.textContent = drink.desc;
  statsEl.innerHTML = "";
  const vol = document.createElement("span");
  vol.className = "tag";
  vol.textContent = drink.ml + " мл";
  const str = document.createElement("span");
  str.className = "tag";
  str.textContent = "Крепость";
  str.appendChild(beans(drink.strength));
  statsEl.append(vol, str);
  card.hidden = false;
  requestAnimationFrame(() => card.classList.add("show"));
  againBtn.focus({ preventScroll: true });
}

function spin() {
  if (busy) return;
  busy = true;
  spinBtn.disabled = true;
  card.classList.remove("show");
  card.hidden = true;
  cupwrap.classList.remove("shaking");
  void cupwrap.offsetWidth;
  cupwrap.classList.add("shaking");
  const options = pool();
  const drink = options[Math.floor(Math.random() * options.length)];
  setTimeout(() => {
    show(drink);
    busy = false;
    spinBtn.disabled = false;
  }, 650);
}

spinBtn.addEventListener("click", spin);
againBtn.addEventListener("click", spin);
</script>
</body>
</html>
